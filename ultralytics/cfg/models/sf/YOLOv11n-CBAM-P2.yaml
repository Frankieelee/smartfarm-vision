# YOLOv11n + CBAM + P2 + Enhanced SPPF
# 专为小目标检测优化（微型绿植叶片检测）
# 特性：
# 1. P2检测头 - 提升小目标检测能力
# 2. CBAM注意力 - 增强特征表达
# 3. YOLOv26风格SPPF - 更强的多尺度特征融合

scale: n

nc: 2 # 修改为你的类别数：seed_leaf, true_leaf
scales: # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLOv11n backbone with enhanced SPPF
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9 使用YOLOv26增强版SPPF
  - [-1, 2, C2PSA, [1024]] # 10

# YOLOv11n head with P2 + CBAM
head:
  # P5 -> P4
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # 12 cat backbone P4
  - [-1, 2, C3k2, [512, False]] # 13

  # P4 -> P3
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # 15 cat backbone P3
  - [-1, 2, C3k2, [256, False]] # 16

  # P3 -> P2 (新增)
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]] # 18 cat backbone P2
  - [-1, 2, C3k2, [128, False]] # 19 (P2/4-xsmall)
  - [-1, 1, CBAM, [7]] # 20 CBAM for P2 - 关键！小目标增强

  # P2 -> P3
  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 16], 1, Concat, [1]] # 22 cat head P3
  - [-1, 2, C3k2, [256, False]] # 23 (P3/8-small)
  - [-1, 1, CBAM, [7]] # 24 CBAM for P3

  # P3 -> P4
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]] # 26 cat head P4
  - [-1, 2, C3k2, [512, False]] # 27 (P4/16-medium)
  - [-1, 1, CBAM, [7]] # 28 CBAM for P4

  # P4 -> P5
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]] # 30 cat head P5
  - [-1, 2, C3k2, [1024, True]] # 31 (P5/32-large)
  - [-1, 1, CBAM, [7]] # 32 CBAM for P5

  # Detect head with 4 scales
  - [[20, 24, 28, 32], 1, Detect, [nc]] # 33 Detect(P2, P3, P4, P5)
